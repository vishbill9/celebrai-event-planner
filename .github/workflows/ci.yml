name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm --prefix server install --include=dev
      - run: npm --prefix client install --include=dev
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
