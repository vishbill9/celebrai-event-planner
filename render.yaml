# Render Blueprint: New > Blueprint > select this repository.
# One Web Service builds the React client and the Express API and serves both.
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: celebrai-event-planner
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_MODEL
        value: glm-5.3
      - key: OLLAMA_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
